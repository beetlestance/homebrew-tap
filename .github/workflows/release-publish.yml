name: Release Publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          if [[ ! "$BRANCH" =~ ^release-git-sentinel-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branches must match release-git-sentinel-vX.Y.Z"
            exit 1
          fi

          TAG="${BRANCH#release-}"
          VERSION="${TAG#git-sentinel-v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify CLI version
        run: |
          EXPECTED="git-sentinel v${{ steps.version.outputs.version }}"
          ACTUAL="$(bash git-sentinel/bin/git-sentinel version)"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          generate_release_notes: true
          make_latest: true

      - name: Generate backmerge token
        id: backmerge-token
        uses: actions/create-github-app-token@v2
        with:
          client-id: ${{ secrets.RELEASE_BACKMERGE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BACKMERGE_PRIVATE_KEY }}
          owner: beetlestance
          repositories: homebrew-tap

      - name: Fast-forward develop
        env:
          BACKMERGE_TOKEN: ${{ steps.backmerge-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ -z "${BACKMERGE_TOKEN:-}" ]]; then
            echo "::error::Failed to generate release backmerge GitHub App token"
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${BACKMERGE_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin \
            "+refs/heads/develop:refs/remotes/origin/develop" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/heads/release-backmerge"
          git checkout -B develop origin/develop
          git merge --ff-only release-backmerge
          git push origin HEAD:develop
