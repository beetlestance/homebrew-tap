name: Release Publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          if [[ ! "$BRANCH" =~ ^release-git-sentinel-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branches must match release-git-sentinel-vX.Y.Z"
            exit 1
          fi

          TAG="${BRANCH#release-}"
          VERSION="${TAG#git-sentinel-v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify CLI version
        run: |
          EXPECTED="git-sentinel v${{ steps.version.outputs.version }}"
          ACTUAL="$(bash git-sentinel/bin/git-sentinel version)"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Build Homebrew release asset
        id: asset
        run: |
          set -euo pipefail

          ASSET="git-sentinel-${{ steps.version.outputs.version }}.tar.gz"
          ASSET_PATH="$RUNNER_TEMP/$ASSET"
          git ls-tree -rz -r --name-only HEAD git-sentinel \
            | tar \
              --null \
              --files-from=- \
              --sort=name \
              --mtime="UTC 1970-01-01" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --transform="s#^#git-sentinel-${{ steps.version.outputs.version }}/#" \
              -cf - \
            | gzip -n > "$ASSET_PATH"

          echo "path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          GENERATED_FILE="$RUNNER_TEMP/generated-release-notes.md"
          CHANGELOG_FILE="git-sentinel/CHANGELOG.md"

          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$TAG" \
            --jq '.body' > "$GENERATED_FILE"

          if [[ -f "$CHANGELOG_FILE" ]]; then
            awk -v version="$VERSION" '
              BEGIN { heading = "## git-sentinel v" version }
              /^## / {
                if (found) exit
                if ($0 == heading || index($0, heading " - ") == 1) {
                  found = 1
                  next
                }
              }
              found { print }
            ' "$CHANGELOG_FILE" > "$NOTES_FILE"
          fi

          if [[ ! -s "$NOTES_FILE" ]]; then
            cp "$GENERATED_FILE" "$NOTES_FILE"
          else
            {
              printf "\n"
              grep -E '^\*\*Full Changelog\*\*:' "$GENERATED_FILE" || true
            } >> "$NOTES_FILE"
          fi

          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
          NOTES_FILE: ${{ steps.release-notes.outputs.file }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest \
              --draft=false
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

          gh release upload "$TAG" "${{ steps.asset.outputs.path }}" --clobber

      - name: Generate backmerge token
        id: backmerge-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BACKMERGE_APP_ID }}
          private-key: ${{ secrets.RELEASE_BACKMERGE_PRIVATE_KEY }}
          owner: beetlestance
          repositories: homebrew-tap

      - name: Fast-forward develop
        env:
          BACKMERGE_TOKEN: ${{ steps.backmerge-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ -z "${BACKMERGE_TOKEN:-}" ]]; then
            echo "::error::Failed to generate release backmerge GitHub App token"
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${BACKMERGE_TOKEN}@github.com/${{ github.repository }}.git"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git fetch origin \
            "+refs/heads/develop:refs/remotes/origin/develop" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/heads/release-backmerge"
          git checkout -B develop origin/develop
          git merge --ff-only release-backmerge
          git push origin HEAD:develop
