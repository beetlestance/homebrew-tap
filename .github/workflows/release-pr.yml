name: Release PR

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch to verify
        required: true

concurrency:
  group: release-pr-${{ github.event.pull_request.number || inputs.branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release-') && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.branch, 'release-'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BACKMERGE_APP_ID }}
          private-key: ${{ secrets.RELEASE_BACKMERGE_PRIVATE_KEY }}
          owner: beetlestance
          repositories: homebrew-tap

      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref || inputs.branch }}"

          if [[ ! "$BRANCH" =~ ^release-git-sentinel-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branches must match release-git-sentinel-vX.Y.Z"
            exit 1
          fi

          TAG="${BRANCH#release-}"
          VERSION="${TAG#git-sentinel-v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify CLI version
        run: |
          EXPECTED="git-sentinel v${{ steps.version.outputs.version }}"
          ACTUAL="$(bash git-sentinel/bin/git-sentinel version)"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Build Homebrew release asset
        id: asset
        run: |
          set -euo pipefail

          ASSET="git-sentinel-${{ steps.version.outputs.version }}.tar.gz"
          ASSET_PATH="$RUNNER_TEMP/$ASSET"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/$ASSET"
          git ls-tree -rz -r --name-only HEAD git-sentinel \
            | tar \
              --null \
              --files-from=- \
              --sort=name \
              --mtime="UTC 1970-01-01" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --transform="s#^#git-sentinel-${{ steps.version.outputs.version }}/#" \
              -cf - \
            | gzip -n > "$ASSET_PATH"

          SHA256="$(sha256sum "$ASSET_PATH" | awk '{print $1}')"

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        run: |
          git-sentinel/scripts/update-formula.rb \
            --url "${{ steps.asset.outputs.url }}" \
            --sha256 "${{ steps.asset.outputs.sha256 }}" \
            --version "${{ steps.version.outputs.version }}"

      - name: Commit formula update
        id: formula
        run: |
          if git diff --quiet -- Formula/git-sentinel.rb; then
            echo "Formula already points at ${{ steps.version.outputs.tag }}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/git-sentinel.rb
          git commit -m "formula: git-sentinel ${{ steps.version.outputs.version }}"
          git remote set-url origin "https://x-access-token:${{ steps.release-token.outputs.token }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.event.pull_request.head.ref || inputs.branch }}

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tag release head
        if: steps.formula.outputs.changed == 'false'
        run: |
          git tag -f "${{ steps.version.outputs.tag }}" HEAD
          git push -f origin "refs/tags/${{ steps.version.outputs.tag }}"
